name: Afyx Graph Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: python scripts/validate-afyx-graph.py
      - working-directory: afyx-graph/engine
        run: npm ci && npm run build:clean && npm test && npm run test:semantic && npm run test:smoke
      - working-directory: afyx-graph/engine
        run: |
          for target in $(node scripts/distribution-contract.mjs targets); do
            bash scripts/build-bundle.sh "$target"
          done
          (cd release && sha256sum afyx-graph-* > SHA256SUMS)
          version=$(node -p "require('../afyx-graph.json').product_version")
          node ../../scripts/afyx-graph-artifact.mjs create-release-manifest \
            --directory release --output release/RELEASE-MANIFEST.json \
            --revision "$GITHUB_SHA" --version "$version" --tag "afyx-graph-v$version"
      - name: Attest release archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: afyx-graph/engine/release/afyx-graph-*
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import json; print(json.load(open('afyx-graph/afyx-graph.json'))['product_version'])")
          gh release create "afyx-graph-v$version" afyx-graph/engine/release/afyx-graph-* afyx-graph/engine/release/SHA256SUMS afyx-graph/engine/release/RELEASE-MANIFEST.json --target "$GITHUB_SHA" --title "Afyx Graph v$version" --notes "Integrity is recorded in SHA256SUMS and RELEASE-MANIFEST.json; publisher/build provenance is available through GitHub artifact attestations. Afyx Graph is licensed under MIT and requires external Node.js 22.5.0 or newer."
