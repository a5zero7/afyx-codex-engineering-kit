name: Afyx Graph Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python scripts/validate-afyx-graph.py
      - working-directory: afyx-graph/engine
        run: npm ci && npm run build:clean && npm test && npm run test:semantic && npm run test:smoke
      - working-directory: afyx-graph/engine
        run: |
          for target in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bash scripts/build-bundle.sh "$target"
          done
          (cd release && sha256sum afyx-graph-* > SHA256SUMS)
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import json; print(json.load(open('afyx-graph/afyx-graph.json'))['product_version'])")
          gh release create "afyx-graph-v$version" afyx-graph/engine/release/afyx-graph-* afyx-graph/engine/release/SHA256SUMS --title "Afyx Graph v$version" --notes "Afyx Graph self-contained runtimes. See the bundled third-party notices."
