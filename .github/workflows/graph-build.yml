name: Afyx Graph Build

# Normal Afyx Graph CI: host build, unit tests, semantic baseline, CLI smoke and
# MCP smoke on Linux, Windows and macOS (Node 24). Zero-model. The six platform
# bundles are built only by
# graph-release.yml, not on every pull request.

on:
  workflow_dispatch:
  push:
    branches: [release/alpha-0.1]
  pull_request:
    branches: [main, release/alpha-0.1]
    paths:
      - 'afyx-graph/**'
      - 'scripts/install-afyx-graph.*'
      - 'scripts/validate-afyx-graph.py'
      - 'scripts/audit-legacy-identity.py'
      - '.github/workflows/graph-build.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afyx-graph/engine/package-lock.json
      - name: Validate identity, metadata and attribution
        run: python scripts/validate-afyx-graph.py
      - name: Operational independence audit
        run: python scripts/audit-legacy-identity.py
      - name: Install locked dependencies
        working-directory: afyx-graph/engine
        run: npm ci
      - name: Clean build (no stale dist artifacts)
        working-directory: afyx-graph/engine
        run: npm run build:clean
      - name: Unit tests
        working-directory: afyx-graph/engine
        run: npm test
      - name: Semantic baseline
        working-directory: afyx-graph/engine
        run: npm run test:semantic
      - name: CLI and MCP smoke
        working-directory: afyx-graph/engine
        run: npm run test:smoke
      - name: Installer fallback, update and executable verification
        run: |
          export AFYX_GRAPH_RUNTIME_ROOT="$RUNNER_TEMP/afyx-graph-runtime"
          export AFYX_GRAPH_BIN_DIR="$RUNNER_TEMP/afyx-graph-bin"
          ./scripts/install-afyx-graph.sh --offline
          ./scripts/install-afyx-graph.sh --update --archive afyx-graph/engine/release/afyx-graph-linux-x64.tar.gz
          ./scripts/install-afyx-graph.sh --validate-only
          "$AFYX_GRAPH_RUNTIME_ROOT/current/bin/afyx-graph" --version
          "$AFYX_GRAPH_RUNTIME_ROOT/current/bin/afyx-graph" help
      - name: Host bundle smoke
        working-directory: afyx-graph/engine
        run: |
          bash scripts/build-bundle.sh linux-x64
          version=$(node -p "require('../afyx-graph.json').product_version")
          node ../../scripts/afyx-graph-artifact.mjs create-release-manifest \
            --directory release --output release/ALPHA-CANDIDATE-MANIFEST.json \
            --revision "$GITHUB_SHA" --version "$version" --tag "alpha-0.1-$GITHUB_SHA"
          mkdir -p /tmp/afyx-graph-smoke
          tar -xzf release/afyx-graph-linux-x64.tar.gz -C /tmp/afyx-graph-smoke
          node ../../scripts/afyx-graph-artifact.mjs verify-release-manifest \
            --manifest release/ALPHA-CANDIDATE-MANIFEST.json \
            --archive release/afyx-graph-linux-x64.tar.gz \
            --metadata /tmp/afyx-graph-smoke/afyx-graph-linux-x64/metadata.json
          /tmp/afyx-graph-smoke/afyx-graph-linux-x64/bin/afyx-graph --version
          /tmp/afyx-graph-smoke/afyx-graph-linux-x64/bin/afyx-graph help
      - name: Retain SHA-pinned Linux Alpha candidate
        uses: actions/upload-artifact@v4
        with:
          name: afyx-graph-alpha-linux-x64-${{ github.sha }}
          path: |
            afyx-graph/engine/release/afyx-graph-linux-x64.tar.gz
            afyx-graph/engine/release/ALPHA-CANDIDATE-MANIFEST.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afyx-graph/engine/package-lock.json
      - name: Validate identity, metadata and attribution
        run: python scripts/validate-afyx-graph.py
      - name: Install locked dependencies
        working-directory: afyx-graph/engine
        run: npm ci
      - name: Clean build (no stale dist artifacts)
        working-directory: afyx-graph/engine
        run: npm run build:clean
      - name: Semantic baseline
        working-directory: afyx-graph/engine
        run: npm run test:semantic
      - name: CLI and MCP smoke
        working-directory: afyx-graph/engine
        run: npm run test:smoke
      - name: Native PowerShell installer fallback, update and executable verification
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'afyx-graph-runtime'
          ./scripts/install-afyx-graph.ps1 -RuntimeRoot $runtime -SkipPathUpdate -Offline -Confirm:$false
          ./scripts/install-afyx-graph.ps1 -RuntimeRoot $runtime -SkipPathUpdate -Update -ArchivePath ./afyx-graph/engine/release/afyx-graph-win32-x64.zip -Confirm:$false
          ./scripts/install-afyx-graph.ps1 -RuntimeRoot $runtime -ValidateOnly
          & (Join-Path $runtime 'current/bin/afyx-graph.cmd') --version
          & (Join-Path $runtime 'current/bin/afyx-graph.cmd') help
          $version = node -p "require('./afyx-graph/afyx-graph.json').product_version"
          node scripts/afyx-graph-artifact.mjs create-release-manifest `
            --directory afyx-graph/engine/release --output afyx-graph/engine/release/ALPHA-CANDIDATE-MANIFEST.json `
            --revision $env:GITHUB_SHA --version $version --tag "alpha-0.1-$env:GITHUB_SHA"
          node scripts/afyx-graph-artifact.mjs verify-release-manifest `
            --manifest afyx-graph/engine/release/ALPHA-CANDIDATE-MANIFEST.json `
            --archive afyx-graph/engine/release/afyx-graph-win32-x64.zip `
            --metadata (Join-Path $runtime 'current/metadata.json')
      - name: Retain SHA-pinned Windows Alpha candidate
        uses: actions/upload-artifact@v4
        with:
          name: afyx-graph-alpha-win32-x64-${{ github.sha }}
          path: |
            afyx-graph/engine/release/afyx-graph-win32-x64.zip
            afyx-graph/engine/release/ALPHA-CANDIDATE-MANIFEST.json
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: afyx-graph/engine/package-lock.json
      - name: Validate identity, metadata and attribution
        run: python3 scripts/validate-afyx-graph.py
      - name: Operational independence audit
        run: python3 scripts/audit-legacy-identity.py
      - name: Install locked dependencies
        working-directory: afyx-graph/engine
        run: npm ci
      - name: Clean build (no stale dist artifacts)
        working-directory: afyx-graph/engine
        run: npm run build:clean
      - name: Semantic baseline
        working-directory: afyx-graph/engine
        run: npm run test:semantic
      - name: CLI and MCP smoke
        working-directory: afyx-graph/engine
        run: npm run test:smoke
      - name: Installer fallback, update and executable verification
        run: |
          export AFYX_GRAPH_RUNTIME_ROOT="$RUNNER_TEMP/afyx-graph-runtime"
          export AFYX_GRAPH_BIN_DIR="$RUNNER_TEMP/afyx-graph-bin"
          ./scripts/install-afyx-graph.sh --offline
          archive="$(find afyx-graph/engine/release -maxdepth 1 -name 'afyx-graph-darwin-*.tar.gz' -print -quit)"
          test -n "$archive"
          ./scripts/install-afyx-graph.sh --update --archive "$archive"
          ./scripts/install-afyx-graph.sh --validate-only
          "$AFYX_GRAPH_RUNTIME_ROOT/current/bin/afyx-graph" --version
          "$AFYX_GRAPH_RUNTIME_ROOT/current/bin/afyx-graph" help
          version=$(node -p "require('./afyx-graph/afyx-graph.json').product_version")
          node scripts/afyx-graph-artifact.mjs create-release-manifest \
            --directory afyx-graph/engine/release --output afyx-graph/engine/release/ALPHA-CANDIDATE-MANIFEST.json \
            --revision "$GITHUB_SHA" --version "$version" --tag "alpha-0.1-$GITHUB_SHA"
          node scripts/afyx-graph-artifact.mjs verify-release-manifest \
            --manifest afyx-graph/engine/release/ALPHA-CANDIDATE-MANIFEST.json \
            --archive "$archive" --metadata "$AFYX_GRAPH_RUNTIME_ROOT/current/metadata.json"
      - name: Retain SHA-pinned macOS Alpha candidate
        uses: actions/upload-artifact@v4
        with:
          name: afyx-graph-alpha-darwin-${{ runner.arch }}-${{ github.sha }}
          path: |
            afyx-graph/engine/release/afyx-graph-darwin-*.tar.gz
            afyx-graph/engine/release/ALPHA-CANDIDATE-MANIFEST.json
          if-no-files-found: error
