name: Phase 8 offline ledger contract

on:
  pull_request:
    paths:
      - 'scripts/phase8_event_ledger.py'
      - 'scripts/tests/test_phase8_event_ledger.py'
      - '.github/workflows/phase8-ledger.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/phase8_event_ledger.py'
      - 'scripts/tests/test_phase8_event_ledger.py'
      - '.github/workflows/phase8-ledger.yml'

permissions:
  contents: read

jobs:
  ledger:
    name: ledger-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline ledger parser contract
        run: python -m unittest scripts.tests.test_phase8_event_ledger -v
